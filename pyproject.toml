[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Config-driven batch data pipeline: extract -> bronze -> silver -> gold (DuckDB + Parquet)"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3",  # new `lambda x: ...` syntax, QUALIFY, UNION ALL BY NAME
    "pyyaml>=6.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# add the DB driver you need, e.g.  pip install -e ".[postgres]"
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
